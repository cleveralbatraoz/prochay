<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Корзина · Каркаде · 100 г × 1 · ПРОЧАЙ</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <doop-use
      component="TeaShell"
      catalog="false"
      favorites="false"
      cart="page"
      carttarget="navigate:RogTVxDdWr"
    >
      <template slot="content">
        <doop-use
          component="CartReview"
          photo="https://www.prochay.ru/upload/iblock/693/0qow8wiga0a0tt9njoekoo6m4q6gexbv/%D0%B3%D0%B8%D0%B1%D0%B8%D1%81%D0%BA%D1%83%D1%816.jpg"
          product="Каркаде"
          variant="Травяной чай · 100 г"
          amount="1 050 ₽"
          total="1 050 ₽"
        >
          <template slot="quantity">
            <div class="stepper">
              <button
                type="button"
                class="step"
                data-doop-on="click"
                data-doop-action="navigate:esi-TEAwfW"
                data-doop-transition="instant"
                data-doop-duration="160"
                aria-label="Уменьшить количество"
              >
                <span aria-hidden="true">−</span>
              </button>
              <span>1</span>
              <button
                type="button"
                class="step"
                data-doop-on="click"
                data-doop-action="navigate:YyHt42xQb5"
                data-doop-transition="instant"
                data-doop-duration="160"
                aria-label="Увеличить количество"
              >
                <span aria-hidden="true">+</span>
              </button>
            </div>
          </template>
        </doop-use>
      </template>
    </doop-use>
  </body>
</html>
