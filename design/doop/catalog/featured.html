<button
  type="button"
  class="hero-link" data-product="$id"
  data-doop-on="click"
  data-doop-action="navigate:$detail"
  data-doop-transition="slide-left"
  data-doop-duration="160"
>
  <span class="hero-photo">
    <img
      class="hero-pack"
      src="$photo"
      alt=""
    />
    <span class="hero-type">Коллекция ПРОЧАЙ</span>
    <span class="round-arrow">
      <svg
        aria-hidden="true"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M6 18 18 6M7 6h11v11" />
      </svg>
    </span>
  </span>
  <span class="hero-caption">
    <strong class="hero-name">$name</strong>
    <span class="meta">$category · Юньнань</span>
    <span class="price">от $amount</span>
  </span>
</button>
