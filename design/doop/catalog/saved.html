<div class="heading"><h1>Избранное</h1><p class="sub">1 товар</p></div>
<div class="saved-feature">
  <button type="button" class="hero-link" aria-label="Открыть $name" data-doop-on="click" data-doop-action="navigate:item-$id" data-doop-transition="slide-left" data-doop-duration="160">
    <img class="saved-photo object-saved-photo" src="$photo" alt="$name" />
  </button>
  <button type="button" class="save-button" aria-label="Убрать из избранного" data-doop-on="click" data-doop-action="navigate:favorites-empty" data-doop-transition="dissolve" data-doop-duration="160">
    $heart
  </button>
</div>
<div class="saved-caption">
  <span class="meta">$category</span><h2 class="saved-title">$name</h2>
  <p class="row-meta">$unit</p><span class="price">$amount</span>
</div>
<div class="end-actions">
  <button type="button" class="buy" data-doop-on="click" data-doop-action="navigate:item-$id" data-doop-transition="slide-left" data-doop-duration="160">Открыть карточку <span aria-hidden="true">→</span></button>
</div>
