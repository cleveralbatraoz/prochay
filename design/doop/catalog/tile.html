<button type="button" class="tea-card" data-product="$id"
  data-doop-on="click" data-doop-action="navigate:$detail">
  <span class="card-photo"><img src="$photo" alt="" loading="lazy" decoding="async" /></span>
  <span class="meta">$category</span>
  <strong class="product-name">$name</strong>
  <span class="price">$amount <small>$separator $unit</small></span>
</button>
