<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>$title · ПРОЧАЙ</title>
    <style>html, body { height: 100%; margin: 0; }</style>
  </head>
  <body>
    <doop-use component="TeaShell" catalog="page" favorites="false" cart="false">
      <template slot="content">
        <div class="heading catalog-heading"><h1>$title</h1><span class="catalog-count">$count</span></div>
        <nav class="catalog-tabs" aria-label="Разделы каталога">
          $tabs
        </nav>
        $featured
        <div class="grid catalog-grid">
          $tiles
        </div>
      </template>
    </doop-use>
  </body>
</html>
