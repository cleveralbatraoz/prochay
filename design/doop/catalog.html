<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>$title · ПРОЧАЙ</title>
    <style>html, body { height: 100%; margin: 0; }</style>
  </head>
  <body>
    <doop-use component="TeaShell" catalog="page" favorites="false" cart="false">
      <template slot="content">
        <div class="heading catalog-heading"><h1>$title</h1><span class="catalog-count" aria-live="polite" aria-atomic="true">$count</span></div>
        <div class="catalog-search" role="search" aria-label="Поиск в каталоге">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="m16 16 4.5 4.5" />
          </svg>
          <input class="catalog-search-input" type="search" aria-label="Поиск по названию" placeholder="Поиск по названию" enterkeyhint="search" autocomplete="off" />
          <button type="button" class="catalog-search-clear" aria-label="Очистить поиск" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="m7 7 10 10M17 7 7 17" />
            </svg>
          </button>
        </div>
        <nav class="catalog-tabs" aria-label="Разделы каталога">
          $tabs
        </nav>
        $featured
        <div class="grid catalog-grid">
          $tiles
        </div>
        <div class="empty catalog-no-results" hidden>
          <h2>Ничего не найдено</h2>
          <p>Попробуйте другое название.</p>
        </div>
      </template>
    </doop-use>
  </body>
</html>
