<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Корзина · 100 г × 1 · ПРОЧАЙ</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <doop-use component="TeaShell" catalog="false" favorites="false" cart="page" carttarget="navigate:k47DSO2OSK">
      <template slot="content">
        <doop-use
          component="CartReview"
          photo="https://www.prochay.ru/upload/iblock/9a3/jlx46c6f600jnjg7schnfip202yb9ith/IMG_2605.jpg"
          product="Зелёные холмы Юньнани"
          variant="Шу пуэр · 100 г"
          amount="850 ₽"
          total="850 ₽"
        >
          <template slot="quantity">
            <div class="stepper" role="group" aria-label="Количество упаковок по 100 г">
              <button
                type="button"
                class="step"
                aria-label="Уменьшить количество упаковок по 100 г"
                data-doop-on="click"
                data-doop-action="navigate:esi-TEAwfW"
              >
                <span aria-hidden="true">−</span>
              </button>
              <span>1</span>
              <button
                type="button"
                class="step"
                aria-label="Увеличить количество упаковок по 100 г"
                data-doop-on="click"
                data-doop-action="navigate:DBlqVobKNs"
              >
                <span aria-hidden="true">+</span>
              </button>
            </div>
          </template>
          <template slot="extra">
            <button
              type="button"
              class="add-pack"
              data-doop-on="click"
              data-doop-action="navigate:wDEylBwslR"
            >
              <span aria-hidden="true">+</span>
              <span>Добавить 500 г</span>
              <span class="price">4 250 ₽</span>
            </button>
          </template>
        </doop-use>
      </template>
    </doop-use>
  </body>
</html>
