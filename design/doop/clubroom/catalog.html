<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Чайная на Морозова · Каталог ПРОЧАЙ</title>
    <link rel="stylesheet" href="room.css" />
    <link rel="stylesheet" href="catalog.css" />
  </head>
  <body class="catalog">
    <main class="catalog-scroll" id="catalog">
      <header class="shop-mast">
        <img class="brand" src="https://www.prochay.ru/upload/CMax/efd/8u0sym0a1e4s50cbg1d5jzmj0h7fgn4c/logo_web_prochay_svg.svg" alt="ПРОЧАЙ" />
        <span class="shop-city">
          <svg viewBox="0 0 18 22" width="13" height="16" aria-hidden="true">
            <path d="M9 20S2 13.1 2 8.6a7 7 0 0 1 14-.3C16 12.8 9 20 9 20Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="9" cy="8" r="2.2" fill="currentColor"/>
          </svg>
          Ставрополь
        </span>
      </header>

      <section class="room-sign" aria-labelledby="room-title">
        <h1 id="room-title">Чайная <em>на Морозова</em></h1>
        <img class="tea-table" src="tea-table.svg" alt="Глиняный чайник и пиалы на низком деревянном столике" />
      </section>

      <section class="tea-menu" aria-labelledby="menu-title">
        <header class="menu-heading">
          <h2 id="menu-title">Чайная полка</h2>
          <span>3 сорта</span>
        </header>

        <a class="shelf-feature" href="tea.html" data-doop-on="click" data-doop-action="navigate:clubroom-tea" data-doop-transition="dissolve" data-doop-duration="160">
          <span class="featured-copy">
            <span class="tea-kind">Шу пуэр</span>
            <strong>Зелёные холмы <em>Юньнани</em></strong>
            <span class="tea-price">от 850 ₽</span>
          </span>
          <span class="parcel">
            <img src="https://www.prochay.ru/upload/iblock/b5a/r59sa0cvhwu5p3qbf1m81ahn0e4cwc0n/shu-puer-zelyenye-kholmy-yunnani-500gr-2024-prochay-ru.jpg" alt="" />
          </span>
          <svg class="unfold" width="26" height="19" viewBox="0 0 26 19" aria-hidden="true">
            <path d="M2 10c6-.8 12-.5 20-1m-7-6c2.4 2.8 4.9 4.4 7.8 6.2-3.5 2-4.9 3.8-7.2 6.3" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" fill="none"/>
          </svg>
        </a>

        <div class="tea-rows">
          <a class="shelf-row" href="../jasmine.html" data-doop-on="click" data-doop-action="navigate:jasmine" data-doop-transition="dissolve" data-doop-duration="160">
            <span class="tea-swatch jasmine">
              <img src="https://www.prochay.ru/upload/iblock/ada/q6nxxptq4h7dq226e6zesouv6u0guvdm/IMG_2766.jpg" alt="" />
            </span>
            <span class="row-name"><span class="tea-kind">Зелёный чай</span><strong>Моли Хуа Люй Ча</strong></span>
            <span class="row-price">1 100 ₽<small>100 г</small></span>
          </a>
          <a class="shelf-row" href="../hibiscus.html" data-doop-on="click" data-doop-action="navigate:hibiscus" data-doop-transition="dissolve" data-doop-duration="160">
            <span class="tea-swatch hibiscus">
              <img src="https://www.prochay.ru/upload/iblock/693/0qow8wiga0a0tt9njoekoo6m4q6gexbv/%D0%B3%D0%B8%D0%B1%D0%B8%D1%81%D0%BA%D1%83%D1%816.jpg" alt="" />
            </span>
            <span class="row-name"><span class="tea-kind">Травяной чай</span><strong>Каркаде</strong></span>
            <span class="row-price">1 050 ₽<small>100 г</small></span>
          </a>
        </div>
      </section>
    </main>

    <nav class="shop-nav" aria-label="Разделы магазина">
      <a href="#catalog" aria-current="page">
        <svg viewBox="0 0 26 25" aria-hidden="true">
          <path d="M3.7 11.2c4.9.7 12.9 1 18.3.1-1 5.6-4.6 8.4-9 8.4-4.2 0-7.9-3-9.3-8.5Z" fill="currentColor" stroke="none"/>
          <path d="M7.7 21.4c3 .5 7.5.6 10.7-.1M10.1 8.4C6.5 5.2 13.4 5 10.9 1.9m4.2 6.6c-2-1.9 1.4-2.6 1-4.6"/>
        </svg>
        Каталог
      </a>
      <a href="../favorites-empty.html" data-doop-on="click" data-doop-action="navigate:favorites-empty">
        <svg viewBox="0 0 26 25" aria-hidden="true">
          <path d="M13 21.2S2.2 15 2.9 8.7C3.4 3.5 9.3 2 13.2 7.2c3-5.8 9.6-3.5 10 1.1.5 4.7-6.1 10.3-10.2 12.9Z"/>
        </svg>
        Избранное
      </a>
      <a href="../cart-empty.html" data-doop-on="click" data-doop-action="navigate:cart-empty">
        <svg viewBox="0 0 26 25" aria-hidden="true">
          <path d="m4.4 9.4 17.1-.3-.3 12.2c-5.3 1-11.1.9-16.2-.1L4.4 9.4Z"/>
          <path d="M9 11.3V8.1c.2-6.2 8-6.3 8.2-.2l.1 3.4"/>
        </svg>
        Корзина
      </a>
    </nav>
  </body>
</html>
