<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Чайная карта · ПРОЧАЙ</title>
    <link rel="stylesheet" href="room.css" />
    <link rel="stylesheet" href="catalog.css" />
  </head>
  <body class="menu">
    <main id="catalog" class="menu-scroll">
      <header class="imprint">
        <img class="wordmark" src="https://www.prochay.ru/upload/CMax/efd/8u0sym0a1e4s50cbg1d5jzmj0h7fgn4c/logo_web_prochay_svg.svg" alt="ПРОЧАЙ" />
        <span>Ставрополь<br />Морозова, 1</span>
      </header>

      <section class="frontispiece" aria-labelledby="menu-title">
        <img class="infusion" src="tea-spill.svg" alt="" />
        <img class="tea-sign" src="tea-ink.svg" alt="" />
        <h1 id="menu-title">Чайная<br /><em>карта</em></h1>
        <a class="first-tea" href="tea.html" data-doop-on="click" data-doop-action="navigate:clubroom-tea" data-doop-transition="dissolve" data-doop-duration="180">
          <span class="first-caption">
            <span class="tea-type">Шу пуэр <span aria-hidden="true">/</span> Юньнань</span>
            <strong>Зелёные холмы<br />Юньнани</strong>
            <span class="first-price">от 850 ₽
              <svg width="35" height="15" viewBox="0 0 35 15" aria-hidden="true">
                <path d="M1 8.3c9-.6 21-.5 31-.7M25.6 2.1 32 7.6l-7 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </span>
        </a>
      </section>

      <div class="tea-index">
        <a class="tea-entry green" href="../jasmine.html" data-doop-on="click" data-doop-action="navigate:jasmine" data-doop-transition="dissolve" data-doop-duration="180">
          <span class="infusion-sample" aria-hidden="true"></span>
          <span class="entry-title"><span class="tea-type">Зелёный чай</span><strong>Моли Хуа Люй Ча</strong></span>
          <span class="entry-price">1 100 ₽<small>100 г</small></span>
        </a>
        <a class="tea-entry red" href="../hibiscus.html" data-doop-on="click" data-doop-action="navigate:hibiscus" data-doop-transition="dissolve" data-doop-duration="180">
          <span class="infusion-sample" aria-hidden="true"></span>
          <span class="entry-title"><span class="tea-type">Травяной чай</span><strong>Каркаде</strong></span>
          <span class="entry-price">1 050 ₽<small>100 г</small></span>
        </a>
      </div>
    </main>
    <nav class="menu-nav" aria-label="Разделы магазина">
      <a href="#catalog" aria-current="page">Каталог</a>
      <a href="../favorites-empty.html" data-doop-on="click" data-doop-action="navigate:favorites-empty">Избранное</a>
      <a href="../cart-empty.html" data-doop-on="click" data-doop-action="navigate:cart-empty">Корзина</a>
    </nav>
  </body>
</html>
