<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Зелёные холмы Юньнани · ПРОЧАЙ</title>
    <link rel="stylesheet" href="room.css" />
    <link rel="stylesheet" href="detail.css" />
  </head>
  <body>
    <article class="tea-detail">
      <header class="tea-detail-bar">
        <a href="catalog.html" data-doop-on="click" data-doop-action="navigate:clubroom-catalog" data-doop-transition="slide-right" data-doop-duration="160">
          <svg width="26" height="18" viewBox="0 0 26 18" fill="none" aria-hidden="true">
            <path d="M24 9H2m6.5-6.7L1.8 9l6.7 6.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Каталог
        </a>
        <a class="tea-save" href="../favorites.html" data-doop-on="click" data-doop-action="navigate:favorites" data-doop-transition="dissolve" data-doop-duration="160" aria-label="Сохранить чай в избранное">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 20.5C8.9 18.5 2 13.2 2 8.3c0-5.6 6.7-7.5 10-2.5 3.4-5 10-3 10 2.5 0 4.4-6.7 10-10 12.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
          </svg>
          Сохранить
        </a>
      </header>
      <main class="tea-detail-scroll">
        <div class="tea-study">
          <header class="tea-heading">
            <p class="tea-origin">Шу пуэр <span aria-hidden="true">/</span> 2024</p>
            <h1>Зелёные холмы <em>Юньнани</em></h1>
          </header>
          <figure class="tea-object">
            <div class="tea-spillage" aria-hidden="true"></div>
            <div class="tea-objects">
              <div class="tea-leaf-imprint">
                <img src="https://www.prochay.ru/upload/iblock/915/ottxi072dfow4xulb87fcstzru51ogtz/IMG_2603.jpg" alt="Крупный план коричневых листьев и светлых прожилок прессованного шу пуэра" />
              </div>
              <img class="tea-product-photo tea-cup-photo" src="https://www.prochay.ru/upload/iblock/9a3/jlx46c6f600jnjg7schnfip202yb9ith/IMG_2605.jpg" alt="Маленькая фарфоровая пиала с тёмным настоем" />
              <img class="tea-product-photo tea-brick-photo" src="https://www.prochay.ru/upload/iblock/b5a/r59sa0cvhwu5p3qbf1m81ahn0e4cwc0n/shu-puer-zelyenye-kholmy-yunnani-500gr-2024-prochay-ru.jpg" alt="Упаковка целого кирпича пуэра с названием и красной печатью ПРОЧАЙ" />
            </div>
            <figcaption>
              <span class="tea-chinese" lang="zh" aria-hidden="true">普洱</span>
              <span>Юньнань,<br />Китай</span>
            </figcaption>
          </figure>
        </div>
        <section class="tea-tasting" aria-labelledby="tea-flavour">
          <h2 id="tea-flavour">Во вкусе</h2>
          <p>Тёмный шоколад, орех<br />и сухофрукты.</p>
        </section>
        <fieldset class="tea-packing">
          <legend>Фасовка</legend>
          <div class="tea-pack-grid">
            <label class="tea-pack">
              <input type="radio" name="tea-weight" value="100" checked />
              <span class="tea-pack-weight">100 <small>г</small></span>
              <span class="tea-pack-kind">В разломе</span>
              <span class="tea-pack-price">850 ₽</span>
            </label>
            <label class="tea-pack">
              <input type="radio" name="tea-weight" value="500" />
              <span class="tea-pack-weight">500 <small>г</small></span>
              <span class="tea-pack-kind">Целый кирпич</span>
              <span class="tea-pack-price">4 250 ₽</span>
            </label>
          </div>
        </fieldset>
      </main>
      <footer class="tea-order">
        <a class="tea-purchase tea-purchase-100" href="../cart.html" data-doop-on="click" data-doop-action="navigate:cart" data-doop-transition="slide-left" data-doop-duration="160">
          <span>В корзину</span><strong>850 ₽</strong>
        </a>
        <a class="tea-purchase tea-purchase-500" href="../cart-brick.html" data-doop-on="click" data-doop-action="navigate:cart-brick" data-doop-transition="slide-left" data-doop-duration="160">
          <span>В корзину</span><strong>4 250 ₽</strong>
        </a>
      </footer>
    </article>
  </body>
</html>
