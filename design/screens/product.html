<template id="product">
  <div class="detail-bar">
    <button type="button" class="back" data-back>
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m14.5 5-7 7 7 7"></path>
      </svg>
      Назад
    </button>
    <button type="button" class="save-button" data-save>
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.6 5.7a5 5 0 0 0-7.1 0L12 7.1l-1.5-1.4a5 5 0 0 0-7.1 7.1L12 21l8.6-8.2a5 5 0 0 0 0-7.1Z"></path>
      </svg>
    </button>
  </div>
  <div class="detail-photo"><img></div>
  <span class="meta"></span>
  <h1></h1>
  <p class="taste"></p>
  <div class="end-actions">
    <button type="button" class="buy" data-buy><span>В корзину</span><span class="price"></span></button>
  </div>
</template>

<template id="unit">
  <div class="object-unit"><span></span><strong></strong></div>
</template>

<template id="packs">
  <h2 class="field-title">Фасовка</h2>
  <div class="pack-options" aria-label="Фасовка"></div>
</template>

<template id="pack-label"><strong></strong><small></small><span class="price"></span></template>
