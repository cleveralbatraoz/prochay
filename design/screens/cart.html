<template id="cart">
  <section class="cart-content">
    <div class="heading"><h1>Корзина</h1></div>
    <div class="end-actions">
      <div class="summary"><span>Итого</span><strong></strong></div>
      <button type="button" class="buy" data-route="catalog">
        Вернуться в каталог
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 5 7 7-7 7"/>
        </svg>
      </button>
    </div>
  </section>
</template>

<template id="cart-row">
  <div class="cart-row">
    <img alt="">
    <div>
      <h2></h2>
      <p></p>
      <div class="stepper" role="group">
        <button type="button" class="step" data-quantity-change="-1">−</button>
        <span></span>
        <button type="button" class="step" data-quantity-change="1">+</button>
      </div>
    </div>
    <strong class="price"></strong>
  </div>
</template>

<template id="add-pack">
  <button type="button" class="add-pack">
    <span aria-hidden="true">+</span>
    <span class="pack-label"></span>
    <span class="price"></span>
  </button>
</template>

<template id="empty-cart">
  <div class="heading"><h1>Корзина</h1></div>
  <div class="empty">
    <span class="empty-icon">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 7h14l1 14H4L5 7Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>
      </svg>
    </span>
    <h2>Пока пусто</h2>
    <p>Выберите товар в каталоге.</p>
  </div>
  <div class="end-actions">
    <button type="button" class="buy" data-route="catalog">
      В каталог
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 5 7 7-7 7"/>
      </svg>
    </button>
  </div>
</template>
