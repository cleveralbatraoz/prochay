name: Демо

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Проверка демо
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.1
      - name: Установка npm
        run: npm install --global npm@12.2.3
      - name: Установка зависимостей
        run: npm ci
      - name: Аудит зависимостей
        run: npm audit --audit-level=low
      - name: Проверка типов
        run: npm run typecheck
      - name: Сборка
        run: npm run build
      - name: Загрузка сборки для GitHub Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: design/dist

  deploy:
    name: Публикация демо
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Текущий коммит main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '"sha=" + .object.sha' >> "$GITHUB_OUTPUT"
      - name: Публикация на GitHub Pages
        id: pages
        if: steps.main.outputs.sha == github.sha
        uses: actions/deploy-pages@v5.0.1
